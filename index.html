    />
    <meta property="og:title" content="Web Tính Điểm ĐHQG-HCM 2026" />

      property="og:description"
      content="Tính điểm xét tuyển đại học năm 2026 theo phương thức tổng hợp của các trường thành viên ĐHQG-HCM. Cập nhật real-time, lưu tự động và quy đổi chứng chỉ chi tiết."

      name="twitter:description"
      content="Tính điểm xét tuyển đại học năm 2026 theo phương thức tổng hợp của các trường thành viên ĐHQG-HCM. Cập nhật real-time, lưu tự động và quy đổi chứng chỉ chi tiết."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vnuhcm_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((saved === 'system' || !saved) && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#09090b' : '#f6f6f7');
          }
        } catch (e) {
          // Ignore storage access errors in restricted environments
        }
      })();
    </script>
    <title>Web Tính Điểm ĐHQG-HCM 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
